# Built-in camera goes through camera-relay.service (PipeWire node "Built-in Camera") instead.
# - libcamera monitor off: its ov08x40 node crashes PipeWire at sizes <= 1920x1080
# - raw ipu7 ISYS nodes hidden: they never deliver usable frames
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}

monitor.v4l2.rules = [
  {
    matches = [ { device.product.name = "ipu7" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
